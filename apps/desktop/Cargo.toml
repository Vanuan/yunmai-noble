[package]
name = "yunmai-noble-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-unofficial = "1.27.0-pre"
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.27.0-pre" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
