name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # buildpack-deps:bookworm keeps the runtime baseline at glibc 2.36 even
    # though the hosted runners are newer, and ships git for actions/checkout.
    runs-on: ${{ matrix.runner }}
    container: buildpack-deps:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Check tag against package version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          epoch=$(git log -1 --format=%ct)
          if [ -z "$epoch" ]; then
            echo "cannot read the commit timestamp" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils cmake clang libclang-dev unzip xz-utils \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxau-dev libxdmcp-dev libx11-xcb-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        if: matrix.arch == 'amd64'
        run: |
          bun test packages
          bun run typecheck
          cargo test --workspace

      - name: Build packages
        run: packaging/deb/build.sh --arch "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/deb/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev

      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist/deb

      - name: Collect current release packages
        run: |
          mkdir -p dist/release
          cp dist/deb/*.deb dist/release/

      - name: Add previous release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t releases < <(
            gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
              --limit 4 --json tagName --jq '.[].tagName'
          )
          count=0
          for tag in "${releases[@]}"; do
            if [ "$tag" = "$GITHUB_REF_NAME" ]; then
              continue
            fi
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.deb' --dir dist/deb --clobber; then
              count=$((count + 1))
            else
              echo "warning: could not download packages from $tag" >&2
            fi
            if [ "$count" -ge 2 ]; then
              break
            fi
          done
          echo "added packages from $count previous release(s)"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "add the GPG_PRIVATE_KEY repository secret" >&2
            exit 1
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install -d -m 700 "$HOME/.gnupg"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build keyring package
        run: |
          version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' package.json | head -n 1)
          packaging/deb/keyring.sh --out dist/deb
          cp "dist/deb/yunmai-noble-archive-keyring_${version}_all.deb" dist/release/

      - name: Build APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          packaging/deb/repo.sh --in dist/deb --out dist/apt
          --seed-url https://vanuan.github.io/yunmai-noble/apt

      - name: Build PPA source package
        run: >-
          packaging/ppa/build-source.sh --in dist/release --out dist/ppa
          --series noble

      - name: Stage Pages site
        run: |
          mkdir -p site
          cp -a dist/apt site/apt
          cp dist/release/yunmai-noble-archive-keyring_*_all.deb \
            site/apt/yunmai-noble-archive-keyring.deb
          touch site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checksums
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          (cd dist/release && sha256sum *.deb > SHA256SUMS)
          opts=(--batch --yes)
          if [ -n "$GPG_PASSPHRASE" ]; then
            opts+=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          fi
          gpg "${opts[@]}" --armor --detach-sign \
            -o dist/release/SHA256SUMS.asc dist/release/SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/release/*.deb dist/release/SHA256SUMS dist/release/SHA256SUMS.asc)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Attach PPA source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist/ppa -maxdepth 1 -type f -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
