name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxau-dev libxdmcp-dev libx11-xcb-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Bun tests
        run: bun test packages

      - name: Typecheck
        run: bun run typecheck

      - name: Rust tests
        run: cargo test --workspace

  packages:
    # Match the release baseline: build and lint the debs in bookworm.
    runs-on: ubuntu-24.04
    container: buildpack-deps:bookworm
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils cmake clang libclang-dev unzip xz-utils lintian gnupg \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxau-dev libxdmcp-dev libx11-xcb-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: packages

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: packaging/deb/build.sh

      - name: Build keyring package
        run: |
          export GNUPGHOME=$(mktemp -d)
          printf '%%no-protection\nKey-Type: eddsa\nKey-Curve: ed25519\nKey-Usage: sign\nName-Real: CI Key\nName-Email: ci@example.invalid\nExpire-Date: 1d\n%%commit\n' \
            > "$GNUPGHOME/params"
          gpg --batch --generate-key "$GNUPGHOME/params"
          packaging/deb/keyring.sh --out dist/deb

      - name: Lint packages
        run: lintian --fail-on error dist/deb/*.deb
